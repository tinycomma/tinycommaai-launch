<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Comma Ai</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        h2 {
            color: #555;
            margin-top: 40px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .section {
            margin-bottom: 40px;
        }

        .preorder-button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #28a745;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
            margin-top: 10px; /* Add some space above the button */
        }

        .preorder-button:hover {
            background-color: #218838;
        }

        .button-container {
            text-align: center;
            margin-top: 10px;
        }

        ul {
            list-style-type: none; /* Remove default bullet points */
            padding: 0;
        }

        li {
            margin-bottom: 20px; /* Add space between list items */
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: #fff;
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Codename: Tiny Comma Ai</h1>
        <div class="section">
            <h2>Hello World</h2>
            <p>
                
            </p>
        </div>
    </div>

    <footer>
        &copy; 2024 Codename: Tiny Comma Ai. All rights reserved.
    </footer>
</body>

</html>
